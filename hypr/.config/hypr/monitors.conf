# Monitor Configuration
# See Hyprland wiki for more details
# https://wiki.hyprland.org/Configuring/Monitors/
# Configure your Display resolution, offset, scale and Monitors here, use `hyprctl monitors` to get the info.

#Eric's changes
# Sansui 24" on HDMI-A-2 (iGPU): left monitor
monitor=HDMI-A-2, 1920x1080@180, 0x0, 1
# KTC H34S18S ultrawide on DP-2: right monitor, native res, 1.25 scale, 10-bit color
monitor=DP-2, 3440x1440@165, 1920x0, 1.25, bitdepth, 10
# Old monitors (inactive):
#monitor=HDMI-A-1, 1920x1080@90, 0x0, 1

