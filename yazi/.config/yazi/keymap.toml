# keymap.toml
[mgr]
prepend_keymap = [
	{ on = ["g", "G"], run = "cd ~/git", desc = "cd into ~/git with gg" },
	{ on = ["g", "p"], run = "cd ~/'Comp Sci Projects'", desc = "cd into ~/SRU with gs" },
	{ on = ["g", "j"], run = "cd ~/'Comp Sci Projects'", desc = "cd into ~/Comp Sci Projects"},
	{ on = ["g", "n"], run = "cd ~/.config/nvim", desc = "cd into ~/.config/nvim"},
	{ on = ["g", "y"], run = "cd ~/.config/yazi", desc = "cd into ~/.config/yazi"},
	{ on = "<PageUp>", run = "arrow -50%", desc = "Move half page up" },
	{ on = "<PageDown>", run = "arrow 50%", desc = "Move half page down" },
	{ on = "<C-k>", run = "arrow -30%", desc = "Move ~half page up" },
	{ on = "<C-j>", run = "arrow 30%", desc = "Move ~half page down" },
  { on = [ "R", "p", "p" ], run = "plugin sudo -- paste", desc = "sudo paste" },
  { on = [ "R", "r" ], run = "plugin sudo -- rename", desc = "sudo rename" },
  { on = [ "R", "p", "l" ], run = "plugin sudo -- link", desc = "sudo link" },
{ on = ["c", "p"], run = "shell 'libreoffice --headless --convert-to pdf \"$@\"' --block",  desc = "Convert to pdf" },
]
append_keymap = [
	# ...
]
# sudo cp/mv (Sudo Paste)
[[manager.prepend_keymap]]
# sudo cp/mv --force (Sudo Force Paste)
[[manager.prepend_keymap]]
on = [ "R", "p", "P" ]
run = "plugin sudo -- paste --force"
desc = "sudo paste"

# sudo mv (Sudo Rename)
[[manager.prepend_keymap]]
on = [ "R", "r" ]
run = "plugin sudo -- rename"
desc = "sudo rename"

# sudo ln -s (Sudo Absolute Symlink)
[[manager.prepend_keymap]]
on = [ "R", "p", "l" ]
run = "plugin sudo -- link"
desc = "sudo link"

# sudo ln -s (Sudo Relative Symlink)
[[manager.prepend_keymap]]
on = [ "R", "p", "r" ]
run = "plugin sudo -- link --relative"
desc = "sudo link relative path"

# sudo ln (Sudo Hardlink)
[[manager.prepend_keymap]]
on = [ "R", "p", "L" ]
run = "plugin sudo -- hardlink"
desc = "sudo hardlink"
