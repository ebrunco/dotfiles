# swaylock config — lives under ~/.config/sway/ (passed via --config flag)
# https://github.com/swaywm/swaylock

daemonize
ignore-empty-password
show-failed-attempts
show-keyboard-layout
indicator-caps-lock

# Uncomment to use your current wallpaper as background:
# image=$HOME/.config/hypr/wallpaper_effects/.wallpaper_current
color=000000

# Catppuccin Mocha colors
inside-color=1e1e2ecc
inside-clear-color=1e1e2ecc
inside-ver-color=1e1e2ecc
inside-wrong-color=1e1e2ecc

ring-color=cba6f7ff
ring-clear-color=a6e3a1ff
ring-ver-color=89b4faff
ring-wrong-color=f38ba8ff

key-hl-color=cba6f7ff
bs-hl-color=f38ba8ff
caps-lock-key-hl-color=f9e2afff
caps-lock-bs-hl-color=f38ba8ff

line-color=00000000
line-clear-color=00000000
line-ver-color=00000000
line-wrong-color=00000000

separator-color=00000000

text-color=cdd6f4ff
text-clear-color=cdd6f4ff
text-ver-color=cdd6f4ff
text-wrong-color=f38ba8ff

indicator-radius=100
indicator-thickness=7
font=JetBrainsMono Nerd Font
font-size=16
